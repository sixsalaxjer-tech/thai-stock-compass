name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    # Every Monday 00:00 UTC = 07:00 Bangkok time, before the market opens.
    - cron: "0 0 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch latest SET prices from Yahoo Finance
        run: node scripts/refresh-market-data.mjs

      - name: Fetch latest gold price/indicators from Yahoo Finance
        run: node scripts/refresh-gold-data.mjs

      - name: Verify the site still builds with the new data
        run: |
          npm run build
          npm run lint

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="src/lib/marketData.json src/lib/dividendData.json src/lib/goldData.json"
          if git diff --quiet -- $FILES; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add $FILES
          MSG=$(printf 'Refresh SET stock prices and gold indicators\n\nAutomated weekly/on-demand refresh via scripts/refresh-market-data.mjs and\nscripts/refresh-gold-data.mjs (Yahoo Finance, no API key). Analyst target\nprices, dividend yields, and news notes are unaffected - those are\ncurated by hand, not by this workflow.')
          git commit -m "$MSG"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the GitHub Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
